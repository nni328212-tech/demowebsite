<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm - POTECH</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .detail-page{padding:100px 0 60px}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
    .detail-img-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;padding:32px;display:flex;align-items:center;justify-content:center;min-height:400px;position:relative}
    .detail-img-wrap img{max-width:100%;max-height:360px;object-fit:contain;transition:transform .3s}
    .detail-img-wrap:hover img{transform:scale(1.05)}
    .detail-badge{position:absolute;top:16px;left:16px;padding:6px 16px;border-radius:50px;font-size:.8rem;font-weight:700;background:linear-gradient(135deg,var(--accent-warm),#ff9a56);color:#fff}
    .detail-badge.new{background:linear-gradient(135deg,var(--accent),var(--accent-secondary))}
    .detail-info h1{font-size:1.8rem;font-weight:800;line-height:1.3;margin-bottom:8px}
    .detail-sku{font-size:.85rem;color:var(--text-muted);margin-bottom:16px}
    .detail-price-box{background:rgba(0,212,255,.05);border:1px solid var(--border-glow);border-radius:var(--radius);padding:20px;margin-bottom:24px}
    .detail-price{font-size:2rem;font-weight:800;color:var(--accent)}
    .detail-old-price{font-size:1.1rem;color:var(--text-muted);text-decoration:line-through;margin-left:12px}
    .detail-discount{display:inline-block;background:rgba(255,107,53,.15);color:var(--accent-warm);padding:4px 12px;border-radius:50px;font-size:.8rem;font-weight:700;margin-left:12px}
    .detail-unit{font-size:.85rem;color:var(--text-muted);margin-top:6px}
    .detail-volume{margin-top:12px;font-size:.85rem}
    .detail-volume table{width:100%;border-collapse:collapse;margin-top:8px}
    .detail-volume th,.detail-volume td{padding:6px 12px;border:1px solid var(--border);text-align:center;font-size:.8rem}
    .detail-volume th{background:var(--bg-secondary);color:var(--text-muted);font-weight:600}
    .qty-row{display:flex;align-items:center;gap:16px;margin-bottom:20px}
    .qty-control{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
    .qty-control button{width:40px;height:40px;background:var(--bg-secondary);border:none;color:var(--text-primary);font-size:1.2rem;cursor:pointer;transition:var(--transition)}
    .qty-control button:hover{background:rgba(0,212,255,.1);color:var(--accent)}
    .qty-control input{width:60px;height:40px;text-align:center;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);font-size:1rem;font-weight:600;font-family:var(--font)}
    .detail-actions{display:flex;gap:12px;margin-bottom:24px}
    .detail-actions .btn{padding:14px 28px;font-size:.95rem}
    .spec-table{width:100%;margin-top:16px}
    .spec-table tr:nth-child(odd) td{background:rgba(0,212,255,.03)}
    .spec-table td{padding:10px 16px;border-bottom:1px solid var(--border);font-size:.9rem}
    .spec-table td:first-child{font-weight:600;color:var(--text-secondary);width:40%}
    .detail-desc{margin-top:24px;padding:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);line-height:1.7;color:var(--text-secondary)}
    .detail-tabs{display:flex;gap:4px;margin-top:32px;border-bottom:1px solid var(--border)}
    .detail-tab{padding:10px 20px;background:none;border:none;color:var(--text-secondary);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition)}
    .detail-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-panel{display:none;padding:20px 0}.tab-panel.active{display:block}
    .cert-list{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
    .cert-badge{padding:6px 14px;border-radius:50px;font-size:.8rem;font-weight:600;background:rgba(0,212,255,.08);border:1px solid var(--border);color:var(--accent)}
    .related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px}
    .breadcrumb{padding:90px 0 0}.breadcrumb-list{display:flex;gap:8px;font-size:.85rem;color:var(--text-muted);list-style:none}
    .breadcrumb-list a{color:var(--text-secondary)}.breadcrumb-list a:hover{color:var(--accent)}
    .breadcrumb-list li::after{content:'/';margin-left:8px}.breadcrumb-list li:last-child::after{content:''}.breadcrumb-list li:last-child{color:var(--text-primary)}
    .toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#000;padding:14px 24px;border-radius:var(--radius);font-weight:600;z-index:5000;transform:translateY(100px);opacity:0;transition:all .3s}
    .toast.show{transform:translateY(0);opacity:1}
    @media(max-width:768px){.detail-grid{grid-template-columns:1fr}.related-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="bg-grid"></div>

<header class="header scrolled"><div class="container"><nav class="nav">
  <a href="index.html" class="logo">POTECH<span>.vn</span></a>
  <div class="nav-links" id="navLinks">
    <a href="index.html">Trang chủ</a>
    <a href="products.html">Sản phẩm</a>
    <a href="index.html#projects">Dự án</a>
    <a href="index.html#contact">Liên hệ</a>
    <a href="cart.html" class="nav-cta">🛒 Giỏ hàng (<span id="cartCountNav">0</span>)</a>
  </div>
  <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
</nav></div></header>

<nav class="breadcrumb"><div class="container"><ol class="breadcrumb-list">
  <li><a href="index.html">Trang chủ</a></li>
  <li><a href="products.html">Sản phẩm</a></li>
  <li id="bcCategory"></li>
  <li id="bcProduct"></li>
</ol></div></nav>

<section class="detail-page">
  <div class="container">
    <div class="detail-grid" id="detailContent">
      <div style="text-align:center;padding:100px 0;color:var(--text-muted);">Đang tải...</div>
    </div>
    <!-- Related products -->
    <div style="margin-top:48px" id="relatedSection" hidden>
      <h2 style="font-size:1.3rem;margin-bottom:16px;">Sản phẩm liên quan</h2>
      <div class="related-grid" id="relatedGrid"></div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<footer class="footer"><div class="container"><div class="footer-bottom" style="border:none;padding:0;">
  <span>© 2026 POTECH</span><a href="products.html" style="color:var(--accent)">← Tất cả sản phẩm</a>
</div></div></footer>

<script src="js/supabase-client.js"></script>
<script src="js/cart.js"></script>
<script>
const slug = new URLSearchParams(location.search).get('slug');
if (!slug) location.href = 'products.html';

async function loadProduct() {
  const p = await ProductAPI.bySlug(slug);
  if (!p) { document.getElementById('detailContent').innerHTML = '<p style="text-align:center;padding:80px;color:var(--text-muted)">Sản phẩm không tồn tại.</p>'; return; }

  // Get category info
  let catName = '';
  if (p.category_id) {
    try {
      const cats = await supabase.get('categories', `id=eq.${p.category_id}&select=name,slug`);
      if (cats[0]) catName = cats[0].name;
    } catch(e) {}
  }

  document.title = `${p.name} - POTECH | Chip Nichia Nhật Bản`;
  document.getElementById('bcCategory').innerHTML = catName ? `<a href="products.html?cat=${p.category_id}">${catName}</a>` : '';
  document.getElementById('bcProduct').textContent = p.name;

  const discount = p.old_price ? Math.round((1 - p.price / p.old_price) * 100) : 0;
  const specs = typeof p.specs === 'string' ? JSON.parse(p.specs) : (p.specs || {});

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-img-wrap">
      ${p.badge ? `<span class="detail-badge ${p.badge==='Mới'?'new':''}">${p.badge}</span>` : ''}
      <img src="${p.image_url}" alt="${p.name}">
    </div>
    <div class="detail-info">
      <h1>${p.name}</h1>
      <div class="detail-sku">${p.sku ? `SKU: ${p.sku}` : ''} ${catName ? `| ${catName}` : ''}</div>

      <div class="detail-price-box">
        <div>
          <span class="detail-price">${formatVND(p.price)}</span>
          ${p.old_price ? `<span class="detail-old-price">${formatVND(p.old_price)}</span>` : ''}
          ${discount > 0 ? `<span class="detail-discount">Giảm ${discount}%</span>` : ''}
        </div>
        <div class="detail-unit">Đơn vị: ${p.unit || 'bộ'} | Tối thiểu: ${p.min_order_qty || 1} ${p.unit || 'bộ'}</div>
        <div class="detail-volume">
          <strong>💡 Mua số lượng lớn - giá tốt hơn:</strong>
          <table>
            <tr><th>Số lượng</th><th>1-9</th><th>10-49</th><th>50-99</th><th>100+</th></tr>
            <tr><td>Giá/bộ</td><td>${formatVND(p.price)}</td><td>${formatVND(Math.round(p.price*0.95))}</td><td>${formatVND(Math.round(p.price*0.9))}</td><td><strong style="color:var(--accent)">Liên hệ</strong></td></tr>
          </table>
        </div>
      </div>

      <div class="qty-row">
        <span style="font-weight:600">Số lượng:</span>
        <div class="qty-control">
          <button onclick="changeQty(-1)">−</button>
          <input type="number" id="qtyInput" value="${p.min_order_qty || 1}" min="1">
          <button onclick="changeQty(1)">+</button>
        </div>
        <span style="color:var(--text-muted);font-size:.85rem">Tạm tính: <strong id="subtotal" style="color:var(--accent)">${formatVND(p.price * (p.min_order_qty || 1))}</strong></span>
      </div>

      <div class="detail-actions">
        <button class="btn btn-primary" onclick="addToCart()">🛒 Thêm vào giỏ hàng</button>
        <a href="tel:0912122016" class="btn btn-outline">📞 Gọi báo giá</a>
      </div>

      <div class="detail-tabs">
        <button class="detail-tab active" onclick="switchTab(this,'specs')">Thông số kỹ thuật</button>
        <button class="detail-tab" onclick="switchTab(this,'desc')">Mô tả</button>
        <button class="detail-tab" onclick="switchTab(this,'warranty')">Bảo hành</button>
      </div>

      <div class="tab-panel active" id="panel-specs">
        <table class="spec-table">
          <tr><td>Công suất</td><td>${specs.power || p.power_watt+'W'}</td></tr>
          <tr><td>Quang thông</td><td>${specs.lumens || p.lumens+' lm'}</td></tr>
          <tr><td>Chip LED</td><td>${p.chip_brand || 'Nichia (Japan)'}</td></tr>
          <tr><td>Chỉ số IP</td><td>${p.ip_rating || specs.ip || '-'}</td></tr>
          <tr><td>Bảo hành</td><td>${p.warranty_months ? p.warranty_months+' tháng' : specs.warranty || '-'}</td></tr>
          <tr><td>Tuổi thọ</td><td>${p.lifespan_hours ? p.lifespan_hours.toLocaleString()+'h' : '-'}</td></tr>
          <tr><td>Trọng lượng</td><td>${p.weight_kg ? p.weight_kg+' kg' : '-'}</td></tr>
          <tr><td>Xuất xứ</td><td>${p.origin || 'Việt Nam'}</td></tr>
        </table>
        ${(p.certifications && p.certifications.length) ? `<div class="cert-list">${p.certifications.map(c=>`<span class="cert-badge">${c}</span>`).join('')}</div>` : ''}
      </div>
      <div class="tab-panel" id="panel-desc">
        <div class="detail-desc">${p.description || 'Chưa có mô tả chi tiết.'}</div>
      </div>
      <div class="tab-panel" id="panel-warranty">
        <div class="detail-desc">
          <h3>Chính sách bảo hành POTECH</h3>
          <ul style="margin-top:12px;line-height:2">
            <li>✅ Bảo hành ${p.warranty_months || 60} tháng kể từ ngày mua</li>
            <li>✅ Đổi mới trong 30 ngày nếu lỗi nhà sản xuất</li>
            <li>✅ Hỗ trợ kỹ thuật 24/7 qua hotline</li>
            <li>✅ Miễn phí vận chuyển cho đơn hàng trên 10 triệu</li>
            <li>❌ Không bảo hành: hư hỏng do thiên tai, sử dụng sai cách</li>
          </ul>
        </div>
      </div>
    </div>`;

  // Store product data for cart
  window._product = p;
  const qi = document.getElementById('qtyInput');
  qi.oninput = () => { document.getElementById('subtotal').textContent = formatVND(p.price * (+qi.value || 1)); };

  // Related products
  loadRelated(p);
}

function changeQty(d) {
  const i = document.getElementById('qtyInput');
  i.value = Math.max(1, (+i.value||1)+d);
  i.dispatchEvent(new Event('input'));
}

function switchTab(btn, id) {
  document.querySelectorAll('.detail-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`panel-${id}`).classList.add('active');
}

function addToCart() {
  const p = window._product;
  const qty = +(document.getElementById('qtyInput')?.value || 1);
  Cart.add({ id:p.id, name:p.name, sku:p.sku, price:p.price, image_url:p.image_url, qty, unit:p.unit||'bộ' });
  showToast(`✓ Đã thêm ${qty} ${p.unit||'bộ'} "${p.name}" vào giỏ hàng`);
  updateCartCount();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

function updateCartCount() {
  document.getElementById('cartCountNav').textContent = Cart.count();
}

async function loadRelated(product) {
  try {
    const all = await ProductAPI.active();
    const related = all.filter(p => p.category_id === product.category_id && p.id !== product.id).slice(0,4);
    if (!related.length) return;
    document.getElementById('relatedSection').hidden = false;
    document.getElementById('relatedGrid').innerHTML = related.map(p => `
      <a href="product-detail.html?slug=${p.slug}" style="text-decoration:none;color:inherit" class="product-card">
        <div class="product-img" style="height:150px;background:var(--bg-card);display:flex;align-items:center;justify-content:center;padding:12px"><img src="${p.image_url}" alt="${p.name}" style="max-height:100%;object-fit:contain" loading="lazy"></div>
        <div style="padding:14px"><h3 style="font-size:.9rem;margin-bottom:6px">${p.name}</h3><span style="color:var(--accent);font-weight:700">${formatVND(p.price)}</span></div>
      </a>`).join('');
  } catch(e) {}
}

document.getElementById('menuToggle').onclick = () => document.getElementById('navLinks').classList.toggle('active');
updateCartCount();
loadProduct();
</script>
</body>
</html>
