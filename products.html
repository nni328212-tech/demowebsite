<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm Đèn LED - POTECH | Bảng giá 2026</title>
  <meta name="description" content="Bảng giá đèn LED POTECH 2026. Đèn LED nhà xưởng, đèn pha, đèn đường. Chip Nichia Nhật Bản, bảo hành 5 năm.">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .products-page{padding:100px 0 60px}
    .filter-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:40px;align-items:center}
    .filter-btn{padding:8px 20px;border-radius:50px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);font-size:.85rem;font-weight:500;transition:var(--transition);cursor:pointer}
    .filter-btn:hover,.filter-btn.active{background:rgba(0,212,255,.1);border-color:var(--accent);color:var(--accent)}
    .sort-select{margin-left:auto;padding:8px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-secondary);font-size:.85rem;font-family:var(--font)}
    .products-list{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
    .product-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:var(--transition);position:relative}
    .product-card:hover{transform:translateY(-6px);border-color:var(--border-glow);box-shadow:0 16px 48px rgba(0,212,255,.1)}
    .product-badge{position:absolute;top:12px;left:12px;z-index:2;padding:4px 12px;border-radius:50px;font-size:.7rem;font-weight:700;background:linear-gradient(135deg,var(--accent-warm),#ff9a56);color:#fff}
    .product-badge.new{background:linear-gradient(135deg,var(--accent),var(--accent-secondary))}
    .product-badge.special{background:linear-gradient(135deg,#e91e63,#f44336)}
    .product-img{height:200px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#111,#1a1a2e);padding:16px}
    .product-img img{max-height:100%;object-fit:contain;transition:var(--transition)}
    .product-card:hover .product-img img{transform:scale(1.08)}
    .product-info{padding:20px}
    .product-cat{font-size:.75rem;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
    .product-name{font-size:1rem;font-weight:700;margin-bottom:4px;line-height:1.3}
    .product-sku{font-size:.75rem;color:var(--text-muted);margin-bottom:8px}
    .product-specs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .product-spec{padding:3px 8px;border-radius:4px;font-size:.7rem;background:rgba(0,212,255,.08);color:var(--text-secondary)}
    .product-price-row{display:flex;align-items:baseline;gap:10px}
    .product-price{font-size:1.2rem;font-weight:800;color:var(--accent)}
    .product-old-price{font-size:.85rem;color:var(--text-muted);text-decoration:line-through}
    .product-discount{font-size:.7rem;font-weight:700;color:var(--accent-warm);background:rgba(255,107,53,.15);padding:2px 8px;border-radius:4px}
    .product-actions{margin-top:16px;display:flex;gap:8px}
    .product-actions .btn{flex:1;padding:10px;font-size:.8rem;justify-content:center;border-radius:var(--radius-sm)}
    .product-count{color:var(--text-muted);font-size:.85rem}
    .breadcrumb{padding:90px 0 0}.breadcrumb-list{display:flex;gap:8px;font-size:.85rem;color:var(--text-muted);list-style:none}
    .breadcrumb-list a{color:var(--text-secondary);transition:var(--transition)}.breadcrumb-list a:hover{color:var(--accent)}
    .breadcrumb-list li::after{content:'/';margin-left:8px}.breadcrumb-list li:last-child::after{content:''}.breadcrumb-list li:last-child{color:var(--text-primary)}
    .loading{text-align:center;padding:60px 0;color:var(--text-muted)}
    .loading .spinner{display:inline-block;width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1024px){.products-list{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:768px){.products-list{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:480px){.products-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="bg-grid"></div>

<header class="header scrolled" id="header">
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="logo">POTECH<span>.vn</span></a>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Trang chủ</a>
        <a href="index.html#about">Giới thiệu</a>
        <a href="products.html" class="active">Sản phẩm</a>
        <a href="index.html#projects">Dự án</a>
        <a href="index.html#contact">Liên hệ</a>
        <a href="cart.html" class="nav-cta">🛒 Giỏ hàng (<span id="cartCountNav">0</span>)</a>
      </div>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    </nav>
  </div>
</header>

<nav class="breadcrumb" aria-label="Breadcrumb"><div class="container"><ol class="breadcrumb-list"><li><a href="index.html">Trang chủ</a></li><li>Sản phẩm</li></ol></div></nav>

<section class="products-page">
  <div class="container">
    <div class="section-header" style="margin-bottom:32px;text-align:left;max-width:100%;">
      <h1 class="section-title" style="font-size:2rem;">Sản phẩm Đèn LED</h1>
      <p class="product-count" id="productCount"></p>
    </div>
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-cat="all">Tất cả</button>
      <select class="sort-select" id="sortSelect">
        <option value="featured">Nổi bật</option>
        <option value="price-asc">Giá tăng dần</option>
        <option value="price-desc">Giá giảm dần</option>
        <option value="name">Tên A-Z</option>
      </select>
    </div>
    <div id="productsList"><div class="loading"><div class="spinner"></div><p>Đang tải sản phẩm...</p></div></div>
  </div>
</section>

<footer class="footer"><div class="container"><div class="footer-bottom" style="border:none;padding:0;"><span>© 2026 POTECH. All rights reserved.</span><a href="index.html" style="color:var(--accent);">← Về trang chủ</a></div></div></footer>

<script src="js/cart.js"></script>
<script src="js/supabase-client.js"></script>
<script>
let allProducts = [];
let categories = [];
let currentCat = 'all';

async function init() {
  try {
    // Load from Supabase
    categories = await CategoryAPI.list();
    allProducts = await ProductAPI.active();
    buildFilters();
    renderProducts();
  } catch (e) {
    console.error('Supabase error:', e);
    // Fallback to JSON
    try {
      const res = await fetch('data/products.json');
      const data = await res.json();
      allProducts = data.map(p => ({...p, category_name: p.categoryName, category_slug: p.category}));
      categories = [...new Set(data.map(p => p.category))].map(slug => {
        const p = data.find(x => x.category === slug);
        return { slug, name: p.categoryName };
      });
      buildFilters();
      renderProducts();
    } catch { document.getElementById('productsList').innerHTML = '<p style="text-align:center;color:var(--text-muted);">Không tải được sản phẩm.</p>'; }
  }
}

function buildFilters() {
  const bar = document.getElementById('filterBar');
  const sortEl = bar.querySelector('.sort-select');
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat.slug;
    btn.textContent = cat.name;
    btn.onclick = () => {
      bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = cat.slug;
      renderProducts();
    };
    bar.insertBefore(btn, sortEl);
  });
}

function renderProducts() {
  let list = currentCat === 'all' ? [...allProducts] : allProducts.filter(p => p.category_slug === currentCat);
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'price-asc') list.sort((a,b) => a.price - b.price);
  else if (sort === 'price-desc') list.sort((a,b) => b.price - a.price);
  else if (sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
  else list.sort((a,b) => (b.is_featured?1:0) - (a.is_featured?1:0));

  document.getElementById('productCount').textContent = `Hiển thị ${list.length} sản phẩm`;
  if (!list.length) { document.getElementById('productsList').innerHTML = '<p style="text-align:center;padding:60px;color:var(--text-muted);">Không tìm thấy sản phẩm.</p>'; return; }

  document.getElementById('productsList').className = 'products-list';
  document.getElementById('productsList').innerHTML = list.map(p => {
    const discount = p.old_price ? Math.round((1 - p.price / p.old_price) * 100) : 0;
    const badgeClass = p.badge === 'Mới' ? 'new' : p.badge === 'Đặc biệt' ? 'special' : '';
    const specs = typeof p.specs === 'string' ? JSON.parse(p.specs) : p.specs;
    return `<div class="product-card">
      ${p.badge ? `<span class="product-badge ${badgeClass}">${p.badge}</span>` : ''}
      <a href="product-detail.html?slug=${p.slug}" style="text-decoration:none;color:inherit">
        <div class="product-img"><img src="${p.image_url}" alt="${p.name}" loading="lazy"></div>
        <div class="product-info">
          <div class="product-cat">${p.category_name || ''}</div>
          <h3 class="product-name">${p.name}</h3>
          ${p.sku ? `<div class="product-sku">SKU: ${p.sku}</div>` : ''}
          <div class="product-specs">
            ${specs?.power ? `<span class="product-spec">${specs.power}</span>` : ''}
            ${specs?.lumens ? `<span class="product-spec">${specs.lumens}</span>` : ''}
            ${specs?.ip || p.ip_rating ? `<span class="product-spec">${specs?.ip || p.ip_rating}</span>` : ''}
          </div>
          <div class="product-price-row">
            <span class="product-price">${formatVND(p.price)}</span>
            ${p.old_price ? `<span class="product-old-price">${formatVND(p.old_price)}</span>` : ''}
            ${discount > 0 ? `<span class="product-discount">-${discount}%</span>` : ''}
          </div>
        </div>
      </a>
      <div style="padding:0 20px 20px"><div class="product-actions">
        <a href="product-detail.html?slug=${p.slug}" class="btn btn-outline">Xem chi tiết</a>
        <button class="btn btn-primary" onclick="event.stopPropagation();addToCart('${p.id}','${p.name.replace(/'/g,'')}','${p.sku||''}',${p.price},'${p.image_url}','${p.unit||'bộ'}')">🛒 Thêm</button>
      </div></div>
    </div>`;
  }).join('');
}

document.getElementById('sortSelect').onchange = renderProducts;
document.getElementById('menuToggle').onclick = () => document.getElementById('navLinks').classList.toggle('active');

function addToCart(id,name,sku,price,img,unit) {
  Cart.add({id,name,sku,price,image_url:img,qty:1,unit});
  document.getElementById('cartCountNav').textContent = Cart.count();
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--accent);color:#000;padding:14px 24px;border-radius:12px;font-weight:600;z-index:5000;animation:fadeInUp .3s';
  t.textContent = '✓ Đã thêm vào giỏ hàng';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
document.getElementById('cartCountNav').textContent = Cart.count();
init();
</script>
</body>
</html>
